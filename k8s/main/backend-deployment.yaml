apiVersion: apps/v1
kind: Deployment
metadata:
  name: main-backend
  namespace: boilerplate
  labels:
    app: main-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: main-backend
  template:
    metadata:
      labels:
        app: main-backend
    spec:
      initContainers:
        - name: migrate
          image: PLACEHOLDER
          command: ["alembic", "upgrade", "head"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: main-backend-secret
                  key: database-url
      containers:
        - name: main-backend
          image: PLACEHOLDER
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: main-backend-secret
                  key: database-url
            - name: ENVIRONMENT
              value: production
            - name: KEYCLOAK_URL
              value: http://keycloak.boilerplate.svc.cluster.local:8080
            - name: KEYCLOAK_REALM
              value: boilerplate
            - name: KEYCLOAK_AUDIENCE
              value: backend-api
            - name: KEYCLOAK_ADMIN_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: main-backend-secret
                  key: keycloak-admin-client-id
            - name: KEYCLOAK_ADMIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: main-backend-secret
                  key: keycloak-admin-client-secret
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 512Mi
