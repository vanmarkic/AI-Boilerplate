apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tfc-frontend
  namespace: boilerplate
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - PLACEHOLDER
      secretName: tfc-frontend-tls
  rules:
    - host: PLACEHOLDER
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tfc-frontend
                port:
                  number: 80
