[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "audit-framework-postgres"
dynamic = ["version"]
description = "Append-only PostgreSQL AuditStore for audit-framework — the authoritative, queryable audit log."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["audit", "audit-log", "postgresql", "asyncpg", "append-only", "plugin"]
dependencies = ["audit-framework>=0.1,<0.2"]

[project.optional-dependencies]
asyncpg = ["asyncpg>=0.29"]
dev = ["pytest>=8.0"]

# Discovered by audit-framework's PluginRegistry.discover_entrypoints().
[project.entry-points."audit_framework.plugins"]
postgres = "audit_framework_postgres.plugin:register"

[tool.hatch.build.targets.wheel]
packages = ["src/audit_framework_postgres"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../audit-framework/src"]
python_files = ["*_test.py", "test_*.py"]

[tool.hatch.version]
source = "vcs"
raw-options = { tag_regex = "^audit-framework-postgres-v(?P<version>.+)$", fallback_version = "0.0.0" }
