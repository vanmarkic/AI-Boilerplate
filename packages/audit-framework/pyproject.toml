[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "audit-framework"
dynamic = ["version"]
description = "Technology-agnostic audit logging, notification and case-management core. Pipe-and-filter pipeline + ports/adapters, zero runtime dependencies."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = [
    "audit",
    "audit-log",
    "notifications",
    "pipe-and-filter",
    "hexagonal",
    "ports-and-adapters",
    "plugins",
    "siem",
]
dependencies = []

[project.optional-dependencies]
# Core tests are stdlib-only (they drive coroutines with asyncio.run), so only
# pytest itself is needed. pytest-asyncio is for the (future) plugin packages.
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/vanmarkic/AI-Boilerplate"
Repository = "https://github.com/vanmarkic/AI-Boilerplate"

# Plugins register against this entry-point group. The core never imports them.
[project.entry-points."audit_framework.plugins"]

[tool.hatch.build.targets.wheel]
packages = ["src/audit_framework"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Match the monorepo's *_test.py convention (and pytest's test_*.py default).
python_files = ["*_test.py", "test_*.py"]

[tool.hatch.version]
source = "vcs"
raw-options = { tag_regex = "^audit-framework-v(?P<version>.+)$", fallback_version = "0.0.0" }
