[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "audit-framework-elasticsearch"
dynamic = ["version"]
description = "Elasticsearch/OpenSearch ExternalSink for audit-framework — index audit events for search & dashboards."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["audit", "audit-log", "sink", "elasticsearch", "opensearch", "siem", "plugin"]
dependencies = ["audit-framework>=0.1,<0.2"]

[project.optional-dependencies]
httpx = ["httpx>=0.24"]
dev = ["pytest>=8.0"]

# Discovered by audit-framework's PluginRegistry.discover_entrypoints().
[project.entry-points."audit_framework.plugins"]
elasticsearch = "audit_framework_elasticsearch.plugin:register"

[tool.hatch.build.targets.wheel]
packages = ["src/audit_framework_elasticsearch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../audit-framework/src"]
python_files = ["*_test.py", "test_*.py"]

[tool.hatch.version]
source = "vcs"
raw-options = { tag_regex = "^audit-framework-elasticsearch-v(?P<version>.+)$", fallback_version = "0.1.0" }
