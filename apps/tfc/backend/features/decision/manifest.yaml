name: decision
tier: 1
description: Decision CRUD — questions, responses, and outcomes during exercises
version: 0.2.0
dependencies:
  internal: [exercise]
  external: [postgresql]
api_endpoints:
  - POST /api/decisions
  - GET /api/decisions
  - GET /api/decisions/{decision_id}
  - POST /api/decisions/{decision_id}/responses
  - POST /api/decisions/{decision_id}/close
models:
  - Decision
  - DecisionResponseRecord
events_emitted:
  - DecisionCreated
  - DecisionClosed
events_consumed: []
business_rules:
  - "Decisions are linked to an exercise via exercise_id"
  - "A decision can only be closed once"
  - "question_type is 'single_choice' or 'multi_choice'"
  - "In collaborative mode, advisors submit non-binding recommendations"
  - "The decision-maker submits the binding ruling via close_decision"
  - "Stress: each option carries a stress_delta; after scoring, stress = clamp(0, 10, stress + sum(deltas))"
  - "Effective time: STRESS_TIME_TABLE lookup (stress 0 = 300s, stress 10 = 180s)"
  - "forced_option_ids causes auto-inclusion when omitted"
