name: audit
tier: 1
description: Immutable audit trail for all exercise events
version: 0.1.0
dependencies:
  internal: [exercise]
  external: [postgresql]
api_endpoints:
  - GET /api/audit
models: [AuditEntry]
events_emitted: []
events_consumed:
  - StateChange
business_rules:
  - "All engine state changes are logged with timestamp, exercise ID, and event type"
  - "Audit entries are append-only — no updates or deletes"
  - "Filterable by exercise_id query parameter"
