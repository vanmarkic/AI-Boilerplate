# Only allow "websocket" upgrades — prevents H2C smuggling
map $http_upgrade $connection_upgrade {
    websocket "upgrade";
    default   "";
}
map $http_upgrade $proxy_upgrade {
    websocket "websocket";
    default   "";
}

server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API requests to backend (including WebSocket at /api/exercises/{id}/ws)
    location /api/ {
        # Use Docker DNS and resolve dynamically (not just at startup)
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend "http://tfc-backend:8001";
        proxy_pass $backend;
        proxy_set_header Host $server_name;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Connection timeouts
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;

        # WebSocket support — h2c mitigated via map blocks above (websocket-only)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $proxy_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400;
    }

    # Angular SPA — serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Disable caching for index.html (picks up new hashed bundles)
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache";
    }
}
