# SonarQube Configuration
# https://docs.sonarsource.com/sonarqube/9.9/analyzing-source-code/analysis-parameters/

sonar.projectKey=${env.CI_PROJECT_NAME}_${env.CI_PROJECT_ID}
sonar.projectName=${env.CI_PROJECT_NAME}

sonar.sources=apps/main/backend,apps/main/frontend/src
sonar.exclusions=\
  **/node_modules/**,\
  **/__pycache__/**,\
  **/migrations/**,\
  **/generated/**,\
  **/dist/**,\
  **/build/**,\
  **/*.spec.ts,\
  **/*.test.ts,\
  **/test_*.py,\
  **/playwright-report/**

sonar.python.version=3.12
sonar.typescript.lcov.reportPaths=apps/main/frontend/coverage/lcov.info
sonar.python.coverage.reportPaths=apps/main/backend/coverage.xml

sonar.sourceEncoding=UTF-8
