# SonarQube Configuration
# https://docs.sonarsource.com/sonarqube/9.9/analyzing-source-code/analysis-parameters/

sonar.projectKey=${env.CI_PROJECT_NAME}_${env.CI_PROJECT_ID}
sonar.projectName=${env.CI_PROJECT_NAME}

sonar.sources=packages/react-ui/src,packages/design-system
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/*.spec.ts,\
  **/*.test.ts

sonar.typescript.lcov.reportPaths=\
  packages/react-ui/coverage/lcov.info,\
  packages/design-system/coverage/lcov.info

sonar.sourceEncoding=UTF-8
