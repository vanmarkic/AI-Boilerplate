services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: tfc
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    ports:
      - "5433:5432"
    volumes:
      - tfc-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d tfc"]
      interval: 5s
      timeout: 5s
      retries: 5

  tfc-api:
    build:
      context: ..
      dockerfile: apps/tfc/backend/Dockerfile
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql+asyncpg://dev:dev@db:5432/tfc
      ENVIRONMENT: development
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../apps/tfc/backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload

volumes:
  tfc-pgdata:
