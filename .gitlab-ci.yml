# GitLab CI/CD Pipeline
# Mirrors GitHub Actions CI and adds security scanning stages.

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

stages:
  - prepare
  - lint
  - test
  - e2e
  - build
  - deploy
  - security

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.cache/npm"
  POSTGRES_DB: boilerplate_test
  POSTGRES_USER: dev
  POSTGRES_PASSWORD: dev
  FF_NETWORK_PER_BUILD: "true"
  NODE_VERSION: "22"

# ---------------------------------------------------------------------------
# Cache templates
# ---------------------------------------------------------------------------
.python-cache:
  cache:
    key: python-${CI_COMMIT_REF_SLUG}
    paths:
      - .cache/pip

.node-cache:
  cache:
    key: node-${CI_COMMIT_REF_SLUG}
    paths:
      - .cache/npm
      - apps/main/frontend/node_modules

# ===========================================================================
# Prepare Stage – Install dependencies & generate OpenAPI client
# ===========================================================================

install-and-generate:
  stage: prepare
  image: node:22
  extends: .node-cache
  before_script:
    - apt-get update -qq && apt-get install -y -qq python3 python3-pip python3-venv > /dev/null
    - cd apps/main/backend && python3 -m pip install --break-system-packages -e ".[dev]" && cd ..
  script:
    - npm i
    - cd apps/main/backend && python3 -c "import json; from main import create_app; print(json.dumps(create_app().openapi(), indent=2))" > ../shared/openapi.json && cd ..
    - bash shared/scripts/generate-frontend.sh
  artifacts:
    paths:
      - node_modules/
      - apps/main/frontend/node_modules/
      - packages/design-system/node_modules/
      - apps/main/frontend/src/app/shared/api/generated/
      - shared/openapi.json
    expire_in: 1 hour

# ===========================================================================
# Lint Stage
# ===========================================================================

lint-architecture:
  stage: lint
  image: python:3.12-slim
  extends: .python-cache
  script:
    - pip install pyyaml
    - python shared/scripts/lint-architecture.py

lint-backend:
  stage: lint
  image: python:3.12-slim
  extends: .python-cache
  script:
    - cd apps/main/backend
    - pip install ruff
    - ruff check .

lint-frontend:
  stage: lint
  image: node:22-slim
  needs:
    - install-and-generate
  script:
    - cd frontend
    - npm run lint:all

openapi-validate:
  stage: lint
  image: node:22
  needs:
    - install-and-generate
  script:
    - npx @redocly/cli lint shared/openapi.json

# ===========================================================================
# Test Stage
# ===========================================================================

test-backend:
  stage: test
  image: python:3.12-slim
  extends: .python-cache
  services:
    - name: postgres:17
      alias: postgres
      variables:
        POSTGRES_DB: boilerplate_test
        POSTGRES_USER: dev
        POSTGRES_PASSWORD: dev
  variables:
    DATABASE_URL: "postgresql+asyncpg://dev:dev@postgres:5432/boilerplate_test"
  script:
    - cd apps/main/backend
    - pip install -e ".[dev]"
    - alembic upgrade head
    - python -m pytest -v --tb=short

test-frontend:
  stage: test
  image: node:22-slim
  needs:
    - install-and-generate
  script:
    - cd frontend
    - npm run test:ci

# ===========================================================================
# E2E Stage
# ===========================================================================

e2e-frontend:
  stage: e2e
  image: node:22
  needs:
    - lint-frontend
    - test-frontend
  script:
    - cd frontend
    - npx playwright install --with-deps chromium
    - npm run e2e
  artifacts:
    when: always
    paths:
      - apps/main/frontend/playwright-report/
    expire_in: 7 days

# ===========================================================================
# Build Stage
# ===========================================================================

build-frontend:
  stage: build
  image: node:22-slim
  needs:
    - lint-frontend
    - test-frontend
  script:
    - cd frontend
    - npm run build

.docker-build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - |
      if [ -n "$CI_REGISTRY" ] && [ -n "$CI_REGISTRY_USER" ]; then
        docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
      fi

build-backend-image:
  extends: .docker-build
  script:
    - docker build -t "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA" -f apps/main/backend/Dockerfile .
    - |
      if [ -n "$CI_REGISTRY_IMAGE" ]; then
        docker push "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA"
      fi

build-frontend-image:
  extends: .docker-build
  script:
    - docker build -t "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA" -f apps/main/frontend/Dockerfile .
    - |
      if [ -n "$CI_REGISTRY_IMAGE" ]; then
        docker push "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA"
      fi

# ===========================================================================
# Deploy Stage – Storybook to GitLab Pages
# ===========================================================================

pages:
  stage: deploy
  image: node:22
  needs:
    - install-and-generate
  script:
    - cd frontend
    - npm run build-storybook
    - mv storybook-static ../public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - apps/main/frontend/**
        - packages/design-system/**
        - .gitlab-ci.yml

# ===========================================================================
# Security Stage – GitLab built-in security templates
# ===========================================================================
#
# These templates auto-detect languages and package managers. They produce
# reports that surface in the GitLab Security Dashboard and MR widgets.
# See: https://docs.gitlab.com/ee/user/application_security/

include:
  # Static Application Security Testing – finds vulnerabilities in source code
  - template: Security/SAST.gitlab-ci.yml
  # Secret Detection – flags accidentally committed credentials & tokens
  - template: Security/Secret-Detection.gitlab-ci.yml
  # Dependency Scanning – checks pip & npm dependencies against CVE databases
  - template: Security/Dependency-Scanning.gitlab-ci.yml
  # Container Scanning – scans Docker images for OS-level vulnerabilities
  - template: Security/Container-Scanning.gitlab-ci.yml

# Override template defaults to run in the security stage instead of test.
sast:
  stage: security

secret_detection:
  stage: security

dependency_scanning:
  stage: security

container_scanning:
  stage: security
  variables:
    CS_IMAGE: "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA"
  needs:
    - build-backend-image

# ===========================================================================
# Custom Security Jobs
# ===========================================================================

security-npm-audit:
  stage: security
  image: node:22-slim
  extends: .node-cache
  script:
    - cd frontend
    - npm i
    - npm audit --audit-level=high
  allow_failure: true

security-pip-audit:
  stage: security
  image: python:3.12-slim
  extends: .python-cache
  script:
    - pip install pip-audit
    - cd apps/main/backend
    - pip install -e ".[dev]"
    - pip-audit
  allow_failure: true

security-trivy-fs:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy fs --severity HIGH,CRITICAL --exit-code 1 .
  allow_failure: true
