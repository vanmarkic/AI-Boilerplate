# --- npm audit (JS/TS dependency vulnerabilities) ---
npm-audit:
  stage: security
  image: node:22-slim
  tags:
    - linux
    - docker
  script:
    - npm audit --registry=https://registry.npmjs.org
  allow_failure: true
  artifacts:
    when: always
    paths:
      - security-reports/
    expire_in: 30 days

# --- Semgrep (SAST — all languages) ---
semgrep:
  stage: security
  image: semgrep/semgrep:latest
  tags:
    - linux
    - docker
  variables:
    SEMGREP_RULES: p/security-audit p/owasp-top-ten
  script:
    - semgrep scan
        --config "p/security-audit"
        --config "p/owasp-top-ten"
        --exclude "node_modules"
        --exclude ".venv"
        --exclude "dist"
        --exclude ".angular"
        --exclude "**/generated/**"
        --json
        --output semgrep-report.json
        apps/ packages/react-ui/src packages/ui/src shared/
  allow_failure: true
  artifacts:
    when: always
    paths:
      - semgrep-report.json
    expire_in: 30 days

# --- Bandit (Python SAST) ---
bandit:
  stage: security
  image: python:3.12-slim
  tags:
    - linux
    - docker
  script:
    - pip install --quiet bandit
    - bandit -r apps/main/backend apps/tfc/backend shared
        --severity-level medium
        -x "apps/main/backend/.venv,apps/tfc/backend/.venv"
        -f json
        -o bandit-report.json
        || true
  allow_failure: true
  artifacts:
    when: always
    paths:
      - bandit-report.json
    expire_in: 30 days

# --- Grype (SCA — npm + pip dependency vulnerabilities) ---
grype:
  stage: security
  image:
    name: anchore/grype:latest
    entrypoint: [""]
  tags:
    - linux
    - docker
  script:
    - grype dir:.
        --exclude './node_modules'
        --exclude './.git'
        --exclude '**/node_modules'
        --exclude '**/.venv'
        --exclude '**/dist'
        --exclude '**/.angular'
        --fail-on high
        --output json
        > grype-report.json
  allow_failure: true
  artifacts:
    when: always
    paths:
      - grype-report.json
    expire_in: 30 days

# --- Gitleaks (secrets detection in git history) ---
gitleaks:
  stage: security
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  tags:
    - linux
    - docker
  script:
    - gitleaks detect
        --source .
        --report-format json
        --report-path gitleaks-report.json
  allow_failure: true
  artifacts:
    when: always
    paths:
      - gitleaks-report.json
    expire_in: 30 days

# --- pip-audit (Python dependency vulnerabilities) ---
pip-audit:
  stage: security
  image: python:3.12-slim
  tags:
    - linux
    - docker
  script:
    - pip install --quiet pip-audit
    - |
      EXIT_CODE=0
      for lockfile in apps/main/backend/uv.lock apps/tfc/backend/uv.lock; do
        DIR=$(dirname "$lockfile")
        echo "==> Auditing $DIR"
        cd "$DIR"
        pip-audit --format json --output "/builds/$CI_PROJECT_PATH/pip-audit-$(basename $DIR).json" 2>/dev/null || EXIT_CODE=1
        cd /builds/$CI_PROJECT_PATH
      done
      exit $EXIT_CODE
  allow_failure: true
  artifacts:
    when: always
    paths:
      - pip-audit-*.json
    expire_in: 30 days

