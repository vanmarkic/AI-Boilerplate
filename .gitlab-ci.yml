storybook-tests:
  stage: quality
  image: mcr.microsoft.com/playwright:v1.52.0-noble
  tags:
    - linux
    - docker
  before_script:
    - npm config set registry https://developers.naval-group.com/nexus/repository/npm-group/
  script:
    - npm install
    - npm run test:ci --workspace=packages/react-ui
  artifacts:
    when: always
    paths:
      - packages/react-ui/coverage/
    expire_in: 7 days

