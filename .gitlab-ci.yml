storybook-tests:
  stage: test
  image: mcr.microsoft.com/playwright:v1.59.0-noble
  tags:
    - linux
    - docker
  rules:
    - changes:
        - packages/react-ui/**/*
        - packages/react-headless/**/*
        - packages/design-system/**/*
        - package-lock.json
  before_script:
    - npm config set registry https://developers.naval-group.com/nexus/repository/npm-group/
  script:
    - npm install
    - npm run test:ci --workspace=packages/react-ui
  artifacts:
    when: always
    paths:
      - packages/react-ui/coverage/
    expire_in: 7 days

