# --- Grype (SCA — npm + pip dependency vulnerabilities) ---
grype:
  stage: test
  image:
    name: anchore/grype:latest
    entrypoint: [""]
  tags:
    - linux
    - docker
  script:
    - grype dir:.
        --exclude './node_modules'
        --exclude './.git'
        --exclude '**/node_modules'
        --exclude '**/.venv'
        --exclude '**/dist'
        --exclude '**/.angular'
        --fail-on high
        --output json
        > grype-report.json
  allow_failure: true
  artifacts:
    when: always
    paths:
      - grype-report.json
    expire_in: 30 days

# --- Gitleaks (secrets detection in git history) ---
gitleaks:
  stage: test
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  tags:
    - linux
    - docker
  script:
    - gitleaks detect
        --source .
        --report-format json
        --report-path gitleaks-report.json
  allow_failure: true
  artifacts:
    when: always
    paths:
      - gitleaks-report.json
    expire_in: 30 days

