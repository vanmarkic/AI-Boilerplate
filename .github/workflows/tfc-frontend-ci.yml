name: TFC Frontend CI

on:
  push:
    branches: [master]
    paths: ['apps/tfc/frontend/**', 'packages/**']
  pull_request:
    branches: [master]
    paths: ['apps/tfc/frontend/**', 'packages/**']

permissions:
  contents: read

env:
  NODE_VERSION: '22'

defaults:
  run:
    working-directory: apps/tfc/frontend

jobs:
  install:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm i
        working-directory: .
      - uses: actions/cache/save@v5
        with:
          path: |
            node_modules
            apps/tfc/frontend/node_modules
            packages/design-system/node_modules
            packages/tfc-shared/node_modules
          key: tfc-frontend-${{ github.sha }}

  type-check:
    name: Type Check
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            apps/tfc/frontend/node_modules
            packages/design-system/node_modules
            packages/tfc-shared/node_modules
          key: tfc-frontend-${{ github.sha }}
      - run: npm i
        working-directory: .
      - run: npm run lint:tsc:all

  lint:
    name: Lint & Format
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            apps/tfc/frontend/node_modules
            packages/design-system/node_modules
            packages/tfc-shared/node_modules
          key: tfc-frontend-${{ github.sha }}
      - run: npm i
        working-directory: .
      - name: Prettier format check
        run: npx prettier --check .

  test:
    name: Unit Tests
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            apps/tfc/frontend/node_modules
            packages/design-system/node_modules
            packages/tfc-shared/node_modules
          key: tfc-frontend-${{ github.sha }}
      - run: npm i
        working-directory: .
      - run: npm run test:coverage
      - name: Coverage summary
        if: always()
        run: echo "TFC frontend coverage report generated via --code-coverage"

  build:
    name: Build
    needs: [type-check, lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            apps/tfc/frontend/node_modules
            packages/design-system/node_modules
            packages/tfc-shared/node_modules
          key: tfc-frontend-${{ github.sha }}
      - run: npm i
        working-directory: .
      - run: npm run build

  e2e:
    name: E2E Tests (${{ matrix.shard }})
    needs: [type-check, lint, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            apps/tfc/frontend/node_modules
            packages/design-system/node_modules
            packages/tfc-shared/node_modules
          key: tfc-frontend-${{ github.sha }}
      - run: npm i
        working-directory: .
      - run: npx playwright install --with-deps chromium
      - name: Run E2E (changed-only on PRs, full + sharded on push)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            GREP=$(bash shared/scripts/e2e-changed.sh origin/master tfc 2>/dev/null) && \
              npx playwright test --grep "$GREP" --shard=${{ matrix.shard }} || \
              npx playwright test --shard=${{ matrix.shard }}
          else
            npx playwright test --shard=${{ matrix.shard }}
          fi
        working-directory: apps/tfc/frontend
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: tfc-playwright-report-${{ strategy.job-index }}
          path: apps/tfc/frontend/playwright-report/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: tfc-route-screenshots-${{ strategy.job-index }}
          path: apps/tfc/frontend/screenshots/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: tfc-e2e-failure-screenshots-${{ strategy.job-index }}
          path: apps/tfc/frontend/test-results/
          retention-days: 7
