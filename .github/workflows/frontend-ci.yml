name: Frontend CI

on:
  push:
    branches: [master]
    paths: ['apps/main/frontend/**', 'packages/**', 'shared/openapi.json']
  pull_request:
    branches: [master]
    paths: ['apps/main/frontend/**', 'packages/**', 'shared/openapi.json']

permissions:
  contents: read

env:
  NODE_VERSION: '22'

defaults:
  run:
    working-directory: apps/main/frontend

jobs:
  install:
    name: Install & Generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm i
        working-directory: .
      - run: bash shared/scripts/generate-frontend.sh
        working-directory: .
      - uses: actions/cache/save@v5
        with:
          path: |
            node_modules
            apps/main/frontend/node_modules
            packages/design-system/node_modules
            apps/main/frontend/src/app/shared/api/generated
          key: frontend-${{ github.sha }}

  type-check:
    name: Type Check
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            apps/main/frontend/node_modules
            packages/design-system/node_modules
            apps/main/frontend/src/app/shared/api/generated
          key: frontend-${{ github.sha }}
      - run: npm i
        working-directory: .
      - run: npm run lint:tsc:all

  lint:
    name: Lint
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            apps/main/frontend/node_modules
            packages/design-system/node_modules
            apps/main/frontend/src/app/shared/api/generated
          key: frontend-${{ github.sha }}
      - run: npm i
        working-directory: .
      - run: npm run lint:all
      - name: Prettier format check
        run: npx prettier --check .
        working-directory: apps/main/frontend

  test:
    name: Unit Tests
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            apps/main/frontend/node_modules
            packages/design-system/node_modules
            apps/main/frontend/src/app/shared/api/generated
          key: frontend-${{ github.sha }}
      - run: npm i
        working-directory: .
      - name: Run changed tests (PR) or full suite (push)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npm run test:changed
          else
            npm run test:coverage
          fi
      - name: Coverage summary
        if: always()
        run: echo "Frontend coverage report generated via --code-coverage"

  build:
    name: Build
    needs: [type-check, lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            apps/main/frontend/node_modules
            packages/design-system/node_modules
            apps/main/frontend/src/app/shared/api/generated
          key: frontend-${{ github.sha }}
      - run: npm i
        working-directory: .
      - run: npm run build

  e2e:
    if: false  # disabled — expensive (Playwright + chromium + 2 shards)
    name: E2E Tests (${{ matrix.shard }})
    needs: [type-check, lint, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache/restore@v5
        with:
          path: |
            node_modules
            apps/main/frontend/node_modules
            packages/design-system/node_modules
            apps/main/frontend/src/app/shared/api/generated
          key: frontend-${{ github.sha }}
      - run: npm i
        working-directory: .
      - run: npx playwright install --with-deps chromium
      - name: Run E2E (changed-only on PRs, full + sharded on push)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            GREP=$(bash shared/scripts/e2e-changed.sh origin/master main 2>/dev/null) && \
              npx playwright test --grep "$GREP" --shard=${{ matrix.shard }} || \
              npx playwright test --shard=${{ matrix.shard }}
          else
            npx playwright test --shard=${{ matrix.shard }}
          fi
        working-directory: apps/main/frontend
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: apps/main/frontend/playwright-report/
          retention-days: 7
