name: Frontend CI

on:
  push:
    branches: [master]
    paths: ['frontend/**', 'packages/**', 'shared/openapi.json']
  pull_request:
    branches: [master]
    paths: ['frontend/**', 'packages/**', 'shared/openapi.json']

permissions:
  contents: read

env:
  NODE_VERSION: '22'

defaults:
  run:
    working-directory: frontend

jobs:
  install:
    name: Install & Generate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
        working-directory: .
      - run: bash shared/scripts/generate-frontend.sh
        working-directory: .
      - uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            frontend/node_modules
            packages/design-system/node_modules
            frontend/src/app/shared/api/generated
          key: frontend-${{ github.sha }}

  lint:
    name: Lint
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            frontend/node_modules
            packages/design-system/node_modules
            frontend/src/app/shared/api/generated
          key: frontend-${{ github.sha }}
      - run: npm i
        working-directory: .
      - run: npm run lint:all

  test:
    name: Unit Tests
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            frontend/node_modules
            packages/design-system/node_modules
            frontend/src/app/shared/api/generated
          key: frontend-${{ github.sha }}
      - run: npm i
        working-directory: .
      - run: npm run test:ci

  build:
    name: Build
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            frontend/node_modules
            packages/design-system/node_modules
            frontend/src/app/shared/api/generated
          key: frontend-${{ github.sha }}
      - run: npm i
        working-directory: .
      - run: npm run build

  e2e:
    name: E2E Tests
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            frontend/node_modules
            packages/design-system/node_modules
            frontend/src/app/shared/api/generated
          key: frontend-${{ github.sha }}
      - run: npm i
        working-directory: .
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
