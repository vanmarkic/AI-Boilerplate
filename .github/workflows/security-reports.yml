name: Security Scan Reports

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-reports:
    name: Generate & Commit Security Reports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install scanning tools
        run: |
          pip install pip-audit bandit[sarif]
          npm ci
          cd frontend && npm ci

      - name: Install trivy
        run: |
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update && sudo apt-get install -y trivy

      - name: Run security scans
        run: bash shared/scripts/security-scan.sh

      - name: Generate summary report
        env:
          SCAN_BRANCH: ${{ github.head_ref || github.ref_name }}
          SCAN_COMMIT: ${{ github.sha }}
        run: |
          REPORT_DIR=security-reports
          SUMMARY="${REPORT_DIR}/SUMMARY.md"
          echo "# Security Scan Summary" > "$SUMMARY"
          echo "" >> "$SUMMARY"
          echo "**Generated:** $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$SUMMARY"
          echo "**Branch:** $SCAN_BRANCH" >> "$SUMMARY"
          echo "**Commit:** $SCAN_COMMIT" >> "$SUMMARY"
          echo "" >> "$SUMMARY"
          echo "## Reports" >> "$SUMMARY"
          echo "" >> "$SUMMARY"
          for f in "$REPORT_DIR"/*.json; do
            [ -f "$f" ] || continue
            basename="$(basename "$f")"
            echo "- \`${basename}\`" >> "$SUMMARY"
          done
          echo "" >> "$SUMMARY"
          echo "---" >> "$SUMMARY"
          echo "*Auto-generated by the Security Scan Reports workflow.*" >> "$SUMMARY"

      - name: Commit reports
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add security-reports/
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update security scan reports [skip ci]"
          git push

      - name: Upload reports as artifact (PRs)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: security-reports/
          retention-days: 30
