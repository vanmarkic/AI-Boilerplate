name: Deploy TFC

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "apps/tfc/**"
      - "packages/design-system/**"
      - "packages/ui/**"
      - "docker-compose.hetzner.yml"

env:
  BACKEND_IMAGE: ghcr.io/vanmarkic/tfc-backend
  FRONTEND_IMAGE: ghcr.io/vanmarkic/tfc-frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/tfc/backend/Dockerfile
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/tfc/frontend/Dockerfile
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Deploy to Hetzner
        uses: appleboy/ssh-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: 46.224.43.248
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: GH_TOKEN
          script: |
            set -e
            echo "$GH_TOKEN" | docker login ghcr.io -u vanmarkic --password-stdin
            cd /opt/tfc
            git fetch origin master
            git reset --hard origin/master
            docker compose -f docker-compose.hetzner.yml pull tfc-backend tfc-frontend
            docker compose -f docker-compose.hetzner.yml up -d --remove-orphans || {
              echo "=== tfc-backend logs ==="
              docker compose -f docker-compose.hetzner.yml logs --tail 50 tfc-backend
              exit 1
            }
            docker image prune -f
