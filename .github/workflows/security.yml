name: Security

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v6
      - run: semgrep ci --config auto --sarif --output semgrep.sarif
        env:
          SEMGREP_RULES: auto
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('semgrep.sarif') != ''
        with:
          sarif_file: semgrep.sarif

  gitleaks:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      TRIVY_VERSION: '0.57.1'
      TRIVY_DB_REPOSITORY: 'ghcr.io/aquasecurity/trivy-db:2'
    steps:
      - uses: actions/checkout@v6
      - name: Cache Trivy binary
        id: trivy-bin-cache
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/trivy
          key: trivy-bin-${{ runner.os }}-${{ env.TRIVY_VERSION }}
      - name: Install Trivy
        if: steps.trivy-bin-cache.outputs.cache-hit != 'true'
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v${{ env.TRIVY_VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            trivy-db-${{ runner.os }}-
      - name: Run Trivy filesystem scan
        run: trivy fs --severity HIGH,CRITICAL --format sarif --output trivy-fs.sarif .
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-fs.sarif') != ''
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  npm-audit:
    name: npm Audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci
      - run: npm audit --audit-level=high

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pip-audit
      - run: pip install -e ".[dev]"
        working-directory: backend
      - run: pip-audit

  bandit:
    name: Bandit Python Linter
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install bandit[sarif]
      - run: bandit -r backend/ -f sarif -o bandit.sarif || true
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('bandit.sarif') != ''
        with:
          sarif_file: bandit.sarif
          category: bandit

  trivy-docker:
    name: Trivy Docker Image Scan
    runs-on: ubuntu-latest
    continue-on-error: true
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && contains(github.event.pull_request.changed_files_url, 'Dockerfile'))
    env:
      TRIVY_VERSION: '0.57.1'
      TRIVY_DB_REPOSITORY: 'ghcr.io/aquasecurity/trivy-db:2'
    steps:
      - uses: actions/checkout@v6
      - name: Cache Trivy binary
        id: trivy-bin-cache
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/trivy
          key: trivy-bin-${{ runner.os }}-${{ env.TRIVY_VERSION }}
      - name: Install Trivy
        if: steps.trivy-bin-cache.outputs.cache-hit != 'true'
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v${{ env.TRIVY_VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            trivy-db-${{ runner.os }}-
      - name: Build backend Docker image
        run: docker build -t ai-boilerplate-backend:scan backend/
      - name: Run Trivy image scan
        run: trivy image --severity HIGH,CRITICAL --format sarif --output trivy-docker.sarif ai-boilerplate-backend:scan
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-docker.sarif') != ''
        with:
          sarif_file: trivy-docker.sarif
          category: trivy-docker
