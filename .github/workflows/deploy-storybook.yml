name: Deploy Storybook to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'apps/main/frontend/**'
      - 'packages/design-system/**'
      - 'packages/ui/**'
      - '.github/workflows/deploy-storybook.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  build:
    name: Build Storybook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm i
      - run: pip install -e ".[dev]"
        working-directory: apps/main/backend
      - run: python -c "import json; from main import create_app; print(json.dumps(create_app().openapi(), indent=2))" > ../shared/openapi.json
        working-directory: apps/main/backend
      - run: bash shared/scripts/generate-frontend.sh
      - run: npm run build-storybook
        working-directory: apps/main/frontend
        env:
          STORYBOOK_GIT_SHA: ${{ github.sha }}
      - run: |
          SHA="${{ github.sha }}"
          SHORT="${SHA:0:7}"
          echo "<script>console.log('Storybook build: ${SHORT}');</script><div id='sb-git-sha' style='position:fixed;bottom:4px;right:4px;font-size:10px;color:#888;z-index:99999;pointer-events:none;'>${SHORT}</div>" >> apps/main/frontend/storybook-static/index.html
        shell: bash
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/main/frontend/storybook-static

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
