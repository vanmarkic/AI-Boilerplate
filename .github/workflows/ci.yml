name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-architecture:
    name: Architecture Boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - run: pip install packages/python-layer-lint/
      - run: python shared/scripts/lint-architecture.py

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: boilerplate_test
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://dev:dev@localhost:5432/boilerplate_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]"
        working-directory: apps/main/backend
      - name: Restore testmon cache
        if: github.event_name == 'pull_request'
        uses: actions/cache@v5
        with:
          path: apps/main/backend/.testmondata
          key: testmon-${{ runner.os }}-${{ hashFiles('apps/main/backend/pyproject.toml') }}
          restore-keys: testmon-${{ runner.os }}-
      - run: alembic upgrade head
        working-directory: apps/main/backend
      - name: Run changed tests (PR) or full suite (push)
        working-directory: apps/main/backend
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python -m pytest -v --tb=short --testmon \
              --cov=core --cov=features \
              --cov-report=term-missing --cov-report=xml
          else
            python -m pytest -v --tb=short \
              --cov=core --cov=features \
              --cov-report=term-missing --cov-report=xml
          fi
      - name: Coverage summary
        if: always()
        working-directory: apps/main/backend
        run: |
          if [ -f coverage.xml ]; then
            echo "Coverage report saved to coverage.xml"
          fi

  test-tfc-backend:
    name: TFC Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: tfc_test
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://dev:dev@localhost:5432/tfc_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]"
        working-directory: apps/tfc/backend
      - run: alembic upgrade head
        working-directory: apps/tfc/backend
      - run: python -m pytest -v --tb=short
        working-directory: apps/tfc/backend

  lint-backend:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff && ruff check .
        working-directory: apps/main/backend
      - run: ruff format --check .
        working-directory: apps/main/backend

  tier1-build-smoke:
    name: Tier-1 Build Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: pip install pyyaml
      - run: pip install packages/monorepo-tier-filter/

      - name: Filter features to tier 1
        run: |
          python shared/scripts/filter-features.py --tier=1 \
            --src=apps/main/backend/features --dest=/tmp/tier1-be
          python shared/scripts/filter-features.py --tier=1 \
            --src=apps/main/frontend/src/app/features --dest=/tmp/tier1-fe --frontend

      - name: Apply filtered features to working tree
        run: |
          rm -rf apps/main/frontend/src/app/features
          cp -r /tmp/tier1-fe apps/main/frontend/src/app/features
          cp /tmp/app.routes.filtered.ts apps/main/frontend/src/app/app.routes.ts

      - name: Static verification (no higher-tier leaks)
        run: >
          python shared/scripts/verify-tier-build.py --tier=1
          --backend-dest=/tmp/tier1-be
          --frontend-dest=/tmp/tier1-fe

      - run: npm i
      - run: node -e "require('@rollup/rollup-linux-x64-gnu')" 2>/dev/null || npm i @rollup/rollup-linux-x64-gnu

      - name: Build tier-1 production bundle
        run: npm run build
        working-directory: apps/main/frontend

      - name: Verify canary markers absent
        run: |
          if grep -r 'CANARY_TIER2_FRONTEND_MARKER' apps/main/frontend/dist/ 2>/dev/null; then
            echo "FAIL: tier-2 canary found in tier-1 frontend bundle"
            exit 1
          fi
          if grep -r 'CANARY_TIER2_BACKEND_MARKER' /tmp/tier1-be/ 2>/dev/null; then
            echo "FAIL: tier-2 canary found in tier-1 backend"
            exit 1
          fi
          echo "OK: no tier-2 canary markers in tier-1 build"

  migration-rollback-main:
    name: Migration Rollback (main)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: boilerplate_test
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://dev:dev@localhost:5432/boilerplate_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]"
        working-directory: apps/main/backend
      - name: Test migration upgrade + downgrade
        working-directory: apps/main/backend
        run: python -m pytest tests/migration_rollback_test.py -v --tb=short

  migration-rollback-tfc:
    name: Migration Rollback (TFC)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: tfc_test
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: dev
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://dev:dev@localhost:5433/tfc_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]"
        working-directory: apps/tfc/backend
      - name: Test migration upgrade + downgrade
        working-directory: apps/tfc/backend
        run: python -m pytest tests/migration_rollback_test.py -v --tb=short

  openapi-validate:
    name: OpenAPI Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npx @redocly/cli lint shared/openapi.json
