name: audit-framework CI (tests + SAST + vuln)

# Scoped gate for the publishable `packages/audit-framework` library: runs the
# unit tests plus SAST (Bandit, Semgrep) and dependency vulnerability scanning
# (pip-audit) on every PR that touches the package. Kept package-scoped on
# purpose so it stays cheap — the repo-wide `security.yml` (CodeQL + full
# Semgrep sweep) remains opt-in (workflow_dispatch) as the maintainers intended.

on:
  pull_request:
    paths:
      - 'packages/audit-framework/**'
      - '.github/workflows/audit-framework-ci.yml'
  push:
    branches: [master]
    paths:
      - 'packages/audit-framework/**'
      - '.github/workflows/audit-framework-ci.yml'

permissions:
  contents: read
  security-events: write

defaults:
  run:
    working-directory: packages/audit-framework

jobs:
  tests:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]"
      - run: pytest -q

  bandit:
    name: Bandit SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install "bandit[sarif]"
      # Gate on MEDIUM+ findings (-ll). Emits SARIF for the Security tab too.
      - run: bandit -r src/ -ll -f sarif -o bandit.sarif
      - name: Upload Bandit SARIF
        if: always()
        continue-on-error: true  # best-effort: don't fail if code scanning is off
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: packages/audit-framework/bandit.sarif
          category: audit-framework-bandit

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v6
      # --error makes Semgrep exit non-zero on findings, so the PR is gated.
      - run: semgrep scan --config auto --error --sarif --output semgrep.sarif .
      - name: Upload Semgrep SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: packages/audit-framework/semgrep.sarif
          category: audit-framework-semgrep

  pip-audit:
    name: pip-audit (dependency vulns)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install pip-audit
      # Audit only the package's third-party dependency tree — NOT the package
      # itself, which is unpublished and so can't be resolved on PyPI. Zero
      # runtime deps today (stays green); starts failing the moment a vulnerable
      # dependency is introduced.
      - name: Resolve dependency tree
        run: |
          python -m venv /tmp/auditenv
          /tmp/auditenv/bin/pip install --quiet .
          /tmp/auditenv/bin/pip freeze | grep -viE '^audit[-_]framework' > /tmp/deps.txt || true
          echo "Dependencies to audit:"; cat /tmp/deps.txt
      - name: Audit dependencies
        run: |
          if [ -s /tmp/deps.txt ]; then
            pip-audit --strict --requirement /tmp/deps.txt
          else
            echo "No third-party runtime dependencies to audit."
          fi
