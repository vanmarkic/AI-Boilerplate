name: audit-framework CI (tests + SAST + vuln)

# Scoped gate for the publishable audit-framework library packages: runs the
# unit tests plus SAST (Bandit, Semgrep) and dependency vulnerability scanning
# (pip-audit) on every PR that touches them. A matrix covers each package so new
# plugin packages just need a matrix entry. Kept package-scoped on purpose so it
# stays cheap — the repo-wide `security.yml` (CodeQL + full Semgrep sweep)
# remains opt-in (workflow_dispatch) as the maintainers intended.

on:
  pull_request:
    paths:
      - 'packages/audit-framework/**'
      - 'packages/audit-framework-jsonl/**'
      - 'packages/audit-framework-elasticsearch/**'
      - '.github/workflows/audit-framework-ci.yml'
  push:
    branches: [master]
    paths:
      - 'packages/audit-framework/**'
      - 'packages/audit-framework-jsonl/**'
      - 'packages/audit-framework-elasticsearch/**'
      - '.github/workflows/audit-framework-ci.yml'

permissions:
  contents: read
  security-events: write

jobs:
  tests:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: audit-framework
            needs_core: false
          - package: audit-framework-jsonl
            needs_core: true
          - package: audit-framework-elasticsearch
            needs_core: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # Dependent plugin packages need the (unpublished) core installed first.
      - if: matrix.needs_core
        run: pip install -e packages/audit-framework
      - run: pip install -e ".[dev]"
        working-directory: packages/${{ matrix.package }}
      - run: pytest -q
        working-directory: packages/${{ matrix.package }}

  bandit:
    name: Bandit SAST
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [audit-framework, audit-framework-jsonl, audit-framework-elasticsearch]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install "bandit[sarif]"
      # Gate on MEDIUM+ findings (-ll); emit SARIF for the Security tab too.
      - run: bandit -r src/ -ll -f sarif -o bandit.sarif
        working-directory: packages/${{ matrix.package }}
      - name: Upload Bandit SARIF
        if: always()
        continue-on-error: true  # best-effort: don't fail if code scanning is off
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: packages/${{ matrix.package }}/bandit.sarif
          category: bandit-${{ matrix.package }}

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    strategy:
      fail-fast: false
      matrix:
        package: [audit-framework, audit-framework-jsonl, audit-framework-elasticsearch]
    steps:
      - uses: actions/checkout@v6
      # Security-focused rulesets (not the noisy `auto` best-practice set),
      # scoped to production source. --error gates the PR on any real finding.
      - run: semgrep scan --config p/security-audit --config p/secrets --error --sarif --output semgrep.sarif src/
        working-directory: packages/${{ matrix.package }}
      - name: Upload Semgrep SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: packages/${{ matrix.package }}/semgrep.sarif
          category: semgrep-${{ matrix.package }}

  pip-audit:
    name: pip-audit (dependency vulns)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: audit-framework
            needs_core: false
          - package: audit-framework-jsonl
            needs_core: true
          - package: audit-framework-elasticsearch
            needs_core: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install pip-audit
      # Audit only the package's third-party dependency tree — NOT the
      # unpublished local packages, which can't be resolved on PyPI. Zero
      # runtime deps today (stays green); fails the moment a vulnerable
      # dependency is introduced.
      - name: Resolve dependency tree
        run: |
          python -m venv /tmp/auditenv
          if [ "${{ matrix.needs_core }}" = "true" ]; then
            /tmp/auditenv/bin/pip install --quiet -e "$GITHUB_WORKSPACE/packages/audit-framework"
          fi
          /tmp/auditenv/bin/pip install --quiet .
          /tmp/auditenv/bin/pip freeze | grep -viE '^(-e |audit[-_]framework)' > /tmp/deps.txt || true
          echo "Dependencies to audit:"; cat /tmp/deps.txt
        working-directory: packages/${{ matrix.package }}
      - name: Audit dependencies
        run: |
          if [ -s /tmp/deps.txt ]; then
            pip-audit --strict --requirement /tmp/deps.txt
          else
            echo "No third-party runtime dependencies to audit."
          fi
