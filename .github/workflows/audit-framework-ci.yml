name: audit-framework CI (tests + SAST + vuln)

# Gate for the publishable audit-framework library packages: unit tests + SAST
# (Bandit, Semgrep) + dependency vuln scanning (pip-audit), one matrix leg per
# package. A single `audit-framework gate` check aggregates them, so branch
# protection needs to require just that one check.
#
# This runs on EVERY PR (no path filter) so the aggregate gate check always
# reports — a path-filtered required check would block unrelated PRs forever,
# waiting for a status that never arrives. The lightweight `changes` job skips
# the heavy work when no audit-framework package is touched.

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read
  security-events: write

jobs:
  changes:
    name: Detect package changes
    runs-on: ubuntu-latest
    outputs:
      affected: ${{ steps.detect.outputs.affected }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: detect
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE" ]; then
            echo "affected=true" >> "$GITHUB_OUTPUT"; exit 0   # push events: always run
          fi
          if git diff --name-only "$BASE...HEAD" \
              | grep -Eq '^packages/audit-framework|^\.github/workflows/audit-framework-ci\.yml'; then
            echo "affected=true" >> "$GITHUB_OUTPUT"
          else
            echo "affected=false" >> "$GITHUB_OUTPUT"
          fi

  tests:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.affected == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: audit-framework
            needs_core: false
          - package: audit-framework-jsonl
            needs_core: true
          - package: audit-framework-elasticsearch
            needs_core: true
          - package: audit-framework-postgres
            needs_core: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # Dependent plugin packages need the (unpublished) core installed first.
      - if: matrix.needs_core
        run: pip install -e packages/audit-framework
      - run: pip install -e ".[dev]"
        working-directory: packages/${{ matrix.package }}
      - run: pytest -q
        working-directory: packages/${{ matrix.package }}

  bandit:
    name: Bandit SAST
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.affected == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        package: [audit-framework, audit-framework-jsonl, audit-framework-elasticsearch, audit-framework-postgres]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install "bandit[sarif]"
      # Gate on MEDIUM+ findings (-ll); emit SARIF for the Security tab too.
      - run: bandit -r src/ -ll -f sarif -o bandit.sarif
        working-directory: packages/${{ matrix.package }}
      - name: Upload Bandit SARIF
        if: always()
        continue-on-error: true  # best-effort: don't fail if code scanning is off
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: packages/${{ matrix.package }}/bandit.sarif
          category: bandit-${{ matrix.package }}

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.affected == 'true' }}
    container:
      image: semgrep/semgrep
    strategy:
      fail-fast: false
      matrix:
        package: [audit-framework, audit-framework-jsonl, audit-framework-elasticsearch, audit-framework-postgres]
    steps:
      - uses: actions/checkout@v6
      # Security-focused rulesets (not the noisy `auto` best-practice set),
      # scoped to production source. --error gates the PR on any real finding.
      - run: semgrep scan --config p/security-audit --config p/secrets --error --sarif --output semgrep.sarif src/
        working-directory: packages/${{ matrix.package }}
      - name: Upload Semgrep SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: packages/${{ matrix.package }}/semgrep.sarif
          category: semgrep-${{ matrix.package }}

  pip_audit:
    name: pip-audit (dependency vulns)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.affected == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: audit-framework
            needs_core: false
          - package: audit-framework-jsonl
            needs_core: true
          - package: audit-framework-elasticsearch
            needs_core: true
          - package: audit-framework-postgres
            needs_core: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install pip-audit
      # Audit only the package's third-party dependency tree — NOT the
      # unpublished local packages, which can't be resolved on PyPI. Zero
      # runtime deps today (stays green); fails the moment a vulnerable
      # dependency is introduced.
      - name: Resolve dependency tree
        run: |
          python -m venv /tmp/auditenv
          if [ "${{ matrix.needs_core }}" = "true" ]; then
            /tmp/auditenv/bin/pip install --quiet -e "$GITHUB_WORKSPACE/packages/audit-framework"
          fi
          /tmp/auditenv/bin/pip install --quiet .
          /tmp/auditenv/bin/pip freeze | grep -viE '^(-e |audit[-_]framework)' > /tmp/deps.txt || true
          echo "Dependencies to audit:"; cat /tmp/deps.txt
        working-directory: packages/${{ matrix.package }}
      - name: Audit dependencies
        run: |
          if [ -s /tmp/deps.txt ]; then
            pip-audit --strict --requirement /tmp/deps.txt
          else
            echo "No third-party runtime dependencies to audit."
          fi

  gate:
    name: audit-framework gate
    runs-on: ubuntu-latest
    needs: [changes, tests, bandit, semgrep, pip_audit]
    if: always()
    steps:
      - name: Require all audit-framework checks to pass (or be skipped)
        run: |
          fail=0
          check() {
            case "$2" in
              success|skipped) echo "ok: $1 = $2" ;;
              *) echo "::error::$1 = $2"; fail=1 ;;
            esac
          }
          check changes   "${{ needs.changes.result }}"
          check tests     "${{ needs.tests.result }}"
          check bandit    "${{ needs.bandit.result }}"
          check semgrep   "${{ needs.semgrep.result }}"
          check pip_audit "${{ needs.pip_audit.result }}"
          if [ "$fail" = "1" ]; then
            echo "audit-framework gate: FAILED"; exit 1
          fi
          echo "audit-framework gate: OK"
